<!DOCTYPE html>
<html class="dark" lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
    <title>Subir Contenido - LUXOR Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800;900&family=Be+Vietnam+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "background": "#0F111A",
                        "surface": "#1A1C26",
                        "primary": "#FF4D6D",
                        "secondary": "#00F5D4",
                        "tertiary": "#FF8A00",
                    },
                    fontFamily: {
                        'lexend': ['Lexend', 'sans-serif'],
                        'vietnam': ['Be Vietnam Pro', 'sans-serif'],
                    }
                },
            },
        }
    </script>
    <style>
        .glass-panel {
            background: rgba(26, 28, 38, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .coral-gradient {
            background: linear-gradient(135deg, #FF4D6D 0%, #FF8A00 100%);
        }
        .glow-coral {
            box-shadow: 0 0 20px rgba(255, 77, 109, 0.3);
        }
    </style>
</head>
<body class="bg-[#0F111A] text-slate-200 font-vietnam antialiased">

    <!-- Header -->
    <header class="fixed top-0 w-full z-50 bg-[#0F111A]/80 backdrop-blur-xl border-b border-white/5 flex justify-between items-center px-5 h-16">
        <div class="flex items-center gap-4">
            <button onclick="window.history.back()" class="active:scale-95 duration-200">
                <span class="material-symbols-outlined text-slate-400">arrow_back</span>
            </button>
            <h1 class="font-lexend font-bold text-lg tracking-tight text-white">Subir Contenido</h1>
        </div>
        <button class="text-rose-500 font-lexend font-bold text-sm uppercase tracking-widest">Listo</button>
    </header>

    <main class="pt-24 pb-32 px-5 max-w-2xl mx-auto space-y-8">
        
        <!-- Media Dropzone -->
        <section class="glass-panel border-dashed border-2 border-white/10 rounded-2xl p-10 flex flex-col items-center justify-center gap-4 text-center group hover:border-[#FF4D6D]/50 transition-all cursor-pointer">
            <div class="w-16 h-16 rounded-full bg-[#FF4D6D]/10 flex items-center justify-center group-hover:scale-110 transition-transform duration-300">
                <span class="material-symbols-outlined text-[#FF4D6D] text-4xl">add</span>
            </div>
            <div>
                <p class="font-lexend font-bold text-lg text-white">Cargar Multimedia</p>
                <p class="text-slate-500 text-sm mt-1">Videos o imágenes de alta calidad</p>
            </div>
        </section>

        <!-- Form Details -->
        <section class="space-y-6">
            <div class="space-y-2">
                <label class="font-lexend font-bold text-xs uppercase tracking-widest text-slate-500 ml-1">Título</label>
                <input type="text" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white focus:ring-2 focus:ring-[#FF4D6D] outline-none transition-all placeholder:text-slate-600" placeholder="Dale un nombre a tu creación..."/>
            </div>

            <div class="space-y-2">
                <label class="font-lexend font-bold text-xs uppercase tracking-widest text-slate-500 ml-1">Descripción</label>
                <textarea rows="4" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white focus:ring-2 focus:ring-[#FF4D6D] outline-none transition-all placeholder:text-slate-600 resize-none" placeholder="¿De qué trata este contenido?"></textarea>
            </div>

            <div class="space-y-2">
                <label class="font-lexend font-bold text-xs uppercase tracking-widest text-slate-500 ml-1">Etiquetas</label>
                <div class="flex flex-wrap gap-2">
                    <span class="px-3 py-1 rounded-full bg-slate-800 text-slate-400 text-xs font-lexend border border-white/5 cursor-pointer hover:border-[#00F5D4]/50 transition-colors">#LatamCreator</span>
                    <span class="px-3 py-1 rounded-full bg-slate-800 text-slate-400 text-xs font-lexend border border-white/5 cursor-pointer hover:border-[#00F5D4]/50 transition-colors">#Music</span>
                    <span class="px-3 py-1 rounded-full bg-slate-800 text-slate-400 text-xs font-lexend border border-white/5 cursor-pointer hover:border-[#00F5D4]/50 transition-colors">#Vlog</span>
                    <button class="w-8 h-8 rounded-full border border-white/10 flex items-center justify-center hover:bg-white/5 transition-colors">
                        <span class="material-symbols-outlined text-sm">add</span>
                    </button>
                </div>
            </div>
        </section>

        <!-- Monetization Options -->
        <section class="glass-panel rounded-2xl p-6 space-y-6">
            <label class="font-lexend font-bold text-xs uppercase tracking-widest text-[#00F5D4] block">Configuración de Acceso</label>
            
            <div class="grid grid-cols-3 gap-2">
                <button class="flex flex-col items-center justify-center gap-2 p-4 rounded-xl border border-white/10 bg-white/5 hover:border-[#FF4D6D]/50 transition-all active:scale-95">
                    <span class="material-symbols-outlined text-slate-400">public</span>
                    <span class="font-lexend text-[10px] font-bold uppercase tracking-tighter">Gratis</span>
                </button>
                <button class="flex flex-col items-center justify-center gap-2 p-4 rounded-xl border border-white/10 bg-white/5 hover:border-[#FF4D6D]/50 transition-all active:scale-95">
                    <span class="material-symbols-outlined text-slate-400">star</span>
                    <span class="font-lexend text-[10px] font-bold uppercase tracking-tighter">Fans</span>
                </button>
                <button class="flex flex-col items-center justify-center gap-2 p-4 rounded-xl border-2 border-[#FF4D6D] bg-[#FF4D6D]/10 shadow-[0_0_15px_rgba(255,77,109,0.2)] active:scale-95">
                    <span class="material-symbols-outlined text-[#FF4D6D]">diamond</span>
                    <span class="font-lexend text-[10px] font-bold uppercase tracking-tighter text-[#FF4D6D]">PPV</span>
                </button>
            </div>

            <!-- Price Input -->
            <div class="flex items-center gap-4 p-3 bg-white/5 border border-white/10 rounded-xl">
                <div class="flex items-center gap-2 flex-1">
                    <span class="material-symbols-outlined text-[#FF4D6D]" style="font-variation-settings: 'FILL' 1;">diamond</span>
                    <span class="font-lexend font-bold text-xs uppercase tracking-widest text-slate-400">Precio (Diamantes)</span>
                </div>
                <input type="number" class="w-20 bg-transparent border-none text-right font-lexend font-bold text-lg text-white focus:ring-0" value="50"/>
            </div>
        </section>

        <!-- Submit -->
        <button class="w-full coral-gradient py-4 rounded-full font-lexend font-bold text-white glow-coral active:scale-[0.98] transition-all flex items-center justify-center gap-3">
            <span>Publicar Ahora</span>
            <span class="material-symbols-outlined">rocket_launch</span>
        </button>

        <p class="text-center text-[10px] text-slate-600 font-lexend uppercase tracking-widest pb-10">
            Al publicar confirmas que eres dueño de este contenido.
        </p>

    </main>

    <!-- Bottom Navigation Shell -->
    <nav class="fixed bottom-0 left-0 w-full z-50 bg-[#0F111A]/80 backdrop-blur-xl border-t border-white/5 flex justify-around items-center px-4 pb-8 pt-4 shadow-[0_-10px_40px_rgba(0,0,0,0.5)]">
        <a href="index.html" class="flex flex-col items-center justify-center text-slate-500 hover:text-[#FF4D6D] active:scale-90 transition-all duration-300 no-underline">
            <span class="material-symbols-outlined text-3xl">movie</span>
            <span class="font-['Lexend'] text-[10px] font-semibold uppercase tracking-widest mt-1">Feed</span>
        </a>
        <a href="store.html" class="flex flex-col items-center justify-center text-slate-500 hover:text-[#FF4D6D] active:scale-90 transition-all duration-300 no-underline">
            <span class="material-symbols-outlined text-3xl">grid_view</span>
            <span class="font-['Lexend'] text-[10px] font-semibold uppercase tracking-widest mt-1">Grilla</span>
        </a>
        <a href="wallet.html" class="flex flex-col items-center justify-center text-slate-500 hover:text-[#FF4D6D] active:scale-90 transition-all duration-300 no-underline">
            <span class="material-symbols-outlined text-3xl">account_balance_wallet</span>
            <span class="font-['Lexend'] text-[10px] font-semibold uppercase tracking-widest mt-1">Billetera</span>
        </a>
        <a href="profile.html" class="flex flex-col items-center justify-center text-[#FF4D6D] drop-shadow-[0_0_8px_rgba(255,77,109,0.5)] active:scale-90 transition-all duration-300 no-underline">
            <span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">person</span>
            <span class="font-['Lexend'] text-[10px] font-semibold uppercase tracking-widest mt-1">Perfil</span>
        </a>
    </nav>

</body>
</html>
